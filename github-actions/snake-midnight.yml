name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # every 12h
  workflow_dispatch:
  push:
    branches: [ main ]

concurrency:
  group: reposkins-snake
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%23818cf8,%23be5bf6&color_dots=%232d3343,%233a2d5c,%23616dc7,%23818cf8,%23e0e7ff
            dist/snake-light.svg?color_snake=%23be5bf6,%237c3aed&color_dots=%23e5e7eb,%23c4b5fd,%23a78bfa,%23818cf8,%234c1d95

      # Publishes additively to the "output" branch (a worktree + targeted
      # commit), so it never wipes out other content already living there -
      # e.g. a Space Shooter GIF or other generated assets from a different
      # workflow. Do NOT replace this with an action that force-clears the
      # branch (like gh-pages-style deploy actions) unless you're sure
      # nothing else publishes to "output".
      - name: Publish snake (additive)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code origin refs/heads/output >/dev/null 2>&1; then
            git fetch origin output
            git worktree add /tmp/reposkins-output FETCH_HEAD
          else
            git worktree add --detach /tmp/reposkins-output
            cd /tmp/reposkins-output
            git checkout --orphan output
            git rm -rf . >/dev/null 2>&1 || true
            cd -
          fi
          mkdir -p /tmp/reposkins-output/dist
          cp -f dist/snake-dark.svg dist/snake-light.svg /tmp/reposkins-output/dist/
          cd /tmp/reposkins-output
          git add dist/snake-dark.svg dist/snake-light.svg
          git diff --cached --quiet || git commit -m "Update contribution snake"
          git push origin HEAD:output
