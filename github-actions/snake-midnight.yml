name: generate contribution snake
on:
  schedule:
    - cron: "0 */12 * * *"   # a cada 12h
  workflow_dispatch: {}
  push:
    branches: [ main ]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?color_snake=%23818cf8,%23be5bf6&color_dots=%232d3343,%233a2d5c,%23616dc7,%23818cf8,%23e0e7ff
            dist/snake-light.svg?color_snake=%23be5bf6,%237c3aed&color_dots=%23e5e7eb,%23c4b5fd,%23a78bfa,%23818cf8,%234c1d95
      - uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
